name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like DASH to do?
      description: Features must keep DASH private - no telemetry, no connections the user didn't start.
    validations: { required: true }
